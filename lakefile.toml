name = "Curated"
defaultTargets = ["Curated"]

# The base branch carries the cases and needs nothing but Lean itself, because
# the tactic it binds -- `grind` -- is part of core. Each backend lives on its
# own branch, which adds exactly the dependency that backend needs and rebinds
# `benchmark_tactic` to call it. Nothing here mediates that call.

# Only the root module is a default target, so `lake build` compiles the
# harness without elaborating any case. A case runs when a driver names it.
[[lean_lib]]
name = "Curated"
